apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: camel-monitor
    {{- include "camel-monitor.labels" . | nindent 4 }}
  {{- with .Values.operator.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
  name: camel-monitor-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      name: camel-monitor-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: camel-monitor
        name: camel-monitor-operator
    spec:
      containers:
        - command:
            - camel-monitor
            - operator
          env:
            - name: WATCH_NAMESPACE
              {{- if not .Values.operator.global }}
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
              {{- else }}
              value: ""
              {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.operator.logLevel }}
            - name: OPERATOR_NAME
              value: camel-monitor
            - name: CAMEL_APP_IMPORT
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_ID
              value: {{ .Values.operator.operatorId }}
            - name: CHECK_VERSION_UPGRADE
              value: {{ .Values.operator.checkVersionUpgrade | quote }}
            {{- with .Values.operator.extraEnv }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
          image: {{ .Values.operator.image }}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          name: camel-monitor-operator
          ports:
            - containerPort: 8080
              name: metrics
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.operator.securityContext }}
          {{- with .Values.operator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else }}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: camel-monitor-operator
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
