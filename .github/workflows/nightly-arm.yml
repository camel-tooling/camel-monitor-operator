name: Nightly check against ARM64 architecture

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAMEL_K_VERSION: 2.10.1

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

jobs:
  test-arm64:
    strategy:
      matrix:
        # We want to check this on latest development branch only
        ref-branch: [main]

    if: github.repository == 'apache/camel-k'
    runs-on: ubuntu-24.04-arm
    steps:

    - name: "Checkout code"
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref-branch }}
        persist-credentials: false
        submodules: recursive

    - name: Infra setting
      uses: ./.github/actions/infra-setting

    - name: Install Camel Monitor operator
      shell: bash
      run: |
        kubectl create ns camel
        make install-k8s-global
        kubectl wait --for=condition=available deployment/camel-monitor-operator --timeout=180s -n camel

    # Very useful to create testing application on the fly
    - name: Install Camel K operator
      shell: bash
      run: |
        kubectl create ns camel-k
        kubectl apply -k github.com/apache/camel-k/install/overlays/kubernetes/descoped?ref=v$CAMEL_K_VERSION --server-side
        kubectl wait --for=condition=available deployment/camel-k-operator --timeout=180s -n camel-k
        REGISTRY=$(kubectl -n kube-system get service registry -o jsonpath='{.spec.clusterIP}')
        sed -i "s/REPLACETHIS/$REGISTRY/g" ./.github/actions/infra-setting/default-itp.yaml
        kubectl apply -f ./.github/actions/infra-setting/default-itp.yaml
        kubectl wait --for=jsonpath='{.status.phase}'=Ready itp/camel-k -n camel-k --timeout=120s
        kubectl get itp -n camel-k

    - name: Run test
      shell: bash
      run: |
        GOTESTFMT="-json 2>&1 | gotestfmt" make test-common
