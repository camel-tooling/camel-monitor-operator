name: common

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CAMEL_K_VERSION: 2.11.0
  # Expected latest upstream versions for the UpgradeAvailable tests (otherwise they are skipped).
  # The sample apps are deployed at an older version, so the operator must report an upgrade.
  # Maintainers: bump these when a newer release becomes the latest on Maven Central.
  #   RUNTIME_QUARKUS_TARGET_UPGRADE_VERSION = latest quarkus-camel-bom (Quarkus platform version)
  #   CAMEL_SB_TARGET_UPGRADE_VERSION        = latest camel-spring-boot-bom (Camel version)
  #   CAMEL_MAIN_TARGET_UPGRADE_VERSION      = latest camel-core (Camel version)
  RUNTIME_QUARKUS_TARGET_UPGRADE_VERSION: "3.40.1"
  CAMEL_SB_TARGET_UPGRADE_VERSION: "4.23.0"
  CAMEL_MAIN_TARGET_UPGRADE_VERSION: "4.23.0"

on:
  pull_request:
    branches:
      - main
      - "release-*"
    paths-ignore:
      - 'docs/**'
      - 'proposals/**'
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches:
      - main
      - "release-*"
    paths-ignore:
      - 'docs/**'
      - 'proposals/**'
      - '**.adoc'
      - '**.md'
      - 'KEYS'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive

    - name: Infra setting
      uses: ./.github/actions/infra-setting

    - name: Install Camel Monitor operator
      shell: bash
      run: |
        kubectl create ns camel
        make install-k8s-global
        kubectl wait --for=condition=available deployment/camel-monitor-operator --timeout=180s -n camel

    # Very useful to create testing application on the fly
    - name: Install Camel K operator
      shell: bash
      run: |
        REGISTRY=$(kubectl -n kube-system get service registry -o jsonpath='{.spec.clusterIP}')

        kubectl create ns camel-k
        kubectl create configmap camel-k-operator-configmap-configuration \
          --from-literal=REGISTRY_ADDRESS="$REGISTRY" \
          -n camel-k

        kubectl apply -k github.com/apache/camel-k/install/overlays/all-namespaces?ref=v$CAMEL_K_VERSION --server-side
        kubectl wait --for=condition=available deployment/camel-k-operator --timeout=180s -n camel-k

    - name: Run test
      shell: bash
      run: |
        GOTESTFMT="-json 2>&1 | gotestfmt" make test-common
